databaseChangeLog:
  - changeSet:
      id: create-wallet-table
      author: wallet-api
      changes:
        - createTable:
            tableName: wallet
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: balance
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp

              - column:
                  name: updated_at
                  type: timestamp

  - changeSet:
      id: insert-demo-wallet
      author: wallet-api
      changes:
        - insert:
            tableName: wallet
            columns:
              - column:
                  name: id
                  value: "00000000-0000-0000-0000-000000000001"
              - column:
                  name: balance
                  valueNumeric: 1000
              - column:
                  name: version
                  valueNumeric: 0
